[package]
name = "jellyfin-tauri"
version = "0.1.0"
description = "Jellyfin Desktop Client"
authors = ["Denveous"]
edition = "2021"

[lib]
name = "jellyfin_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "webview-data-url"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
adblock = "0.9"
rmp = "=0.8.14"
minreq = { version = "2", features = ["https"] }
url = "2"

[[bin]]
name = "jellyfin"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
